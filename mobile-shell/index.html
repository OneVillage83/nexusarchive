<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>NexusArchive Mobile Shell</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, Arial, sans-serif;
        background: #020617;
        color: #f8fafc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 28%),
          linear-gradient(160deg, #020617 0%, #081221 44%, #111827 100%);
      }

      main {
        width: min(100%, 440px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 28px;
        background: rgba(2, 6, 23, 0.86);
        padding: 24px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.75rem;
      }

      p {
        margin: 0 0 12px;
        line-height: 1.5;
        color: rgba(248, 250, 252, 0.82);
      }

      code {
        font-family: "SFMono-Regular", Consolas, monospace;
        color: #facc15;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>NexusArchive mobile shell</h1>
      <p>
        This native wrapper expects <code>CAPACITOR_SERVER_URL</code> or
        <code>NEXT_PUBLIC_SITE_URL</code> to point at the hosted NexusArchive
        site.
      </p>
      <p>
        Once that URL is set, Capacitor will load the real site inside the app
        shell and this placeholder will not appear during normal use.
      </p>
    </main>
  </body>
</html>
